<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Swatti · Content Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FFFFFF; --paper-2:#FCFBF8;
  --ink:#0D0C0B; --ink-2:#57534E; --ink-3:#9C968D;
  --rule:#EDEAE4; --rule-2:#DFDAD1;
  --sand:#E2D4BD; --sand-mid:#EFE7D8; --sand-wash:#FAF6EF;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --pad:24px; --maxw:1240px; --base:15px; --rail:264px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  font-size:var(--base);line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,textarea,input{font-family:var(--font)}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible,
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ══════════ masthead ══════════ */
header{position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.hd{max-width:var(--maxw);margin:0 auto;padding:16px var(--pad) 0}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.03em;white-space:nowrap}
.range{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500;
  white-space:nowrap;padding-left:14px;border-left:1px solid var(--rule)}
.roleswitch{display:flex;flex:none;border:1px solid var(--rule-2);padding:2px;background:var(--paper-2)}
.roleswitch button{font-size:11.5px;font-weight:600;letter-spacing:.02em;background:none;border:0;
  color:var(--ink-3);padding:7px 13px;cursor:pointer;min-height:34px;white-space:nowrap}
.roleswitch button[aria-pressed="true"]{background:var(--sand);color:var(--ink)}
.tabsrow{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:12px}
.tabs{display:flex}
.tabs button{font-size:13px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--ink-3);padding:10px 0;margin-right:26px;cursor:pointer;letter-spacing:-0.01em;min-height:42px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sand)}
.sync{font-size:11px;color:var(--ink-3);text-align:right;padding-bottom:4px}
.sync b{color:var(--ink);font-weight:600}
.sync .dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sand);
  margin-right:5px;vertical-align:middle}

/* ══════════ shell ══════════ */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) 120px;
  display:grid;grid-template-columns:var(--rail) 1fr;gap:52px;align-items:start}
main{min-width:0;padding-top:4px}

/* ══════════ rail ══════════ */
.rail{position:sticky;top:118px;padding-top:26px}
.railsec{margin-bottom:30px}
.railsec:last-child{margin-bottom:0}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 12px}
.bigstat{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.bigstat .n{font-size:30px;font-weight:700;letter-spacing:-0.045em;line-height:1;
  font-variant-numeric:tabular-nums}
.bigstat .of{font-size:12.5px;color:var(--ink-3);font-weight:500}
.bar{height:4px;background:var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sand);transition:width .3s ease}
.barnote{font-size:11.5px;color:var(--ink-3);margin:8px 0 0}

.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule)}
.minical span,.minical button{background:var(--paper);font-size:10.5px;font-variant-numeric:tabular-nums;
  aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border:0;color:var(--ink-3);padding:0;line-height:1}
.minical .dw{background:var(--paper-2);font-size:8.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;aspect-ratio:auto;padding:5px 0;color:var(--ink-3)}
.minical .out{color:#CFCAC2}
.minical button{cursor:pointer;color:var(--ink);font-weight:600}
.minical button:hover{background:var(--sand-wash)}
.minical button.inwk{background:var(--sand-wash)}
.minical b{display:block;width:4px;height:4px;border-radius:50%;background:var(--sand)}
.minical button.done b{background:var(--ink)}
.minical .shootday{position:relative}
.minical .shootday::after{content:"";position:absolute;top:3px;right:3px;width:3px;height:3px;
  background:var(--ink);border-radius:50%}

.wklist{list-style:none;margin:0;padding:0}
.wklist button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;
  border-bottom:1px solid var(--rule);padding:11px 0;cursor:pointer;text-align:left;min-height:46px}
.wklist button:hover .wk-n{color:var(--ink)}
.wklist button[aria-current="true"]{border-bottom-color:var(--sand)}
.wklist button[aria-current="true"] .wk-n{color:var(--ink)}
.wk-n{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:-0.01em}
.wk-n small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0;
  font-variant-numeric:tabular-nums}
.wk-dots{display:flex;gap:3px;flex:none}
.wk-dots i{width:6px;height:6px;background:var(--sand-mid);display:block}
.wk-dots i.on{background:var(--ink)}

.inbox{border:1px solid var(--rule);background:var(--paper-2)}
.inbox .ib{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--rule);padding:11px 13px;cursor:pointer}
.inbox .ib:last-child{border-bottom:0}
.inbox .ib:hover{background:var(--sand-wash)}
.inbox .ib-k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px}
.inbox .ib-v{font-size:12.5px;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.inbox .none{padding:13px;font-size:12px;color:var(--ink-3)}
.railtip{font-size:11.5px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--rule);padding-top:12px}
.railtip b{color:var(--ink-2);font-weight:600}

/* ══════════ week strip (mobile) ══════════ */
.weeks{display:none;border-bottom:1px solid var(--rule);overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.weeks button{font-size:12.5px;font-weight:600;white-space:nowrap;background:none;border:0;
  border-bottom:2px solid transparent;color:var(--ink-3);padding:13px 0;margin-right:22px;
  cursor:pointer;min-height:44px}
.weeks button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sand)}

/* ══════════ week header ══════════ */
.wkhead{padding:26px 0 0}
.wkhead .kick{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 7px}
.wkhead h2{font-size:26px;font-weight:700;margin:0;letter-spacing:-0.04em;line-height:1.12;
  text-wrap:balance}
.wkhead h2 span{color:var(--ink-3);font-weight:600}
.wknote{font-size:14.5px;color:var(--ink-2);margin:10px 0 0;max-width:56ch}
.shootbar{display:flex;gap:14px;background:var(--sand-wash);border-left:3px solid var(--sand);
  padding:14px 17px;margin:20px 0 0;font-size:13.5px;color:var(--ink-2)}
.shootbar b{color:var(--ink);font-weight:600}
.shootbar .cam{flex:none;font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--ink-3);padding-top:3px}

/* ══════════ her weekly check-in ══════════ */
.checkin{border:1px solid var(--rule-2);margin:22px 0 6px}
.checkin-h{padding:18px 20px 0}
.checkin h3{font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em}
.checkin .sub{font-size:13.5px;color:var(--ink-2);margin:0;max-width:56ch}
.checkin-b{padding:14px 20px 18px}
textarea{font-size:16px;line-height:1.55;color:var(--ink);width:100%;min-height:84px;
  padding:12px 13px;border:1px solid var(--rule-2);background:var(--paper);resize:vertical;
  border-radius:0;-webkit-appearance:none}
textarea:focus{outline:0;border-color:var(--sand);box-shadow:0 0 0 3px var(--sand-wash)}
textarea::placeholder{color:var(--ink-3)}
.rec{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px}
button.btn{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);
  border:1px solid var(--sand);padding:11px 16px;cursor:pointer;min-height:44px;
  display:inline-flex;align-items:center;gap:8px}
button.btn:hover{background:var(--sand-wash)}
button.btn.solid{background:var(--sand)}
button.btn.rec-on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button.btn.rec-on .live{width:8px;height:8px;border-radius:50%;background:var(--paper);
  animation:pulse 1.1s infinite}
button.btn .mic{width:8px;height:8px;border-radius:50%;background:var(--sand);flex:none}
button.btn.quiet{border-color:var(--rule-2);color:var(--ink-2);font-weight:500}
button.btn.quiet:hover{background:var(--paper-2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.linkbtn{background:none;border:0;font-size:12.5px;color:var(--ink-2);text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;padding:11px 0;min-height:44px}
.recmsg{font-size:12.5px;color:var(--ink-3);flex-basis:100%;min-height:17px}
.player{margin-top:14px;border:1px solid var(--rule);background:var(--paper-2);padding:13px 14px}
.player audio{width:100%;max-width:420px;display:block}
.player .pmeta{font-size:11px;color:var(--ink-3);margin:0 0 9px;letter-spacing:.02em}
.player .pacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.saved{font-size:12px;color:var(--ink-3);margin-top:10px;min-height:16px}

/* ══════════ post cards ══════════ */
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  margin:38px 0 0;padding-bottom:10px;border-bottom:2px solid var(--sand)}
.listhead h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0}
.listhead .meta{font-size:11.5px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:.04em;text-transform:uppercase}

.card{border-bottom:1px solid var(--rule)}
.head{display:grid;grid-template-columns:54px 1fr auto;gap:18px;align-items:start;
  padding:19px 0;cursor:pointer}
.daycol{text-align:left;padding-top:2px;user-select:none}
.daycol .dw{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.daycol .dn{display:block;font-size:23px;font-weight:700;letter-spacing:-0.045em;line-height:1.05;
  font-variant-numeric:tabular-nums;margin-top:1px}
.htext{min-width:0}
.tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:10px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.tagline .type{color:var(--ink)}
.tagline .sep{width:3px;height:3px;background:var(--sand);border-radius:50%;flex:none}
.tagline .flag{color:var(--ink-2);background:var(--sand-wash);padding:3px 7px;letter-spacing:.08em}
.htext h4{font-size:17px;font-weight:600;margin:0;letter-spacing:-0.025em;line-height:1.35;
  text-wrap:balance}
.htext .one{font-size:13.5px;color:var(--ink-3);margin:5px 0 0;max-width:56ch}
.hright{display:flex;align-items:center;gap:14px;padding-top:2px}
.stagepill{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);background:var(--sand-wash);padding:5px 8px;white-space:nowrap}
.stagepill[data-s="0"]{background:var(--paper-2);color:var(--ink-3)}
.stagepill[data-s="4"]{background:var(--sand)}
.tick input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:none;
  border:1.5px solid var(--rule-2);background:var(--paper);cursor:pointer;position:relative;
  transition:background .12s,border-color .12s}
.tick input:hover{border-color:var(--sand)}
.tick input::before{content:"";position:absolute;left:-11px;top:-11px;right:-11px;bottom:-11px}
.tick input:checked{background:var(--sand);border-color:var(--sand)}
.tick input:checked::after{content:"";position:absolute;left:8px;top:3.5px;width:6px;height:12px;
  border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.card.is-done .htext,.card.is-done .daycol{opacity:.42}
.card.is-done .htext h4{text-decoration:line-through}
.body{display:none;padding:0 0 30px 72px}
.card.open .body{display:block}
.card.open .head{padding-bottom:12px}

.dates{display:flex;gap:26px;flex-wrap:wrap;font-size:11.5px;margin:0 0 24px;padding-bottom:15px;
  border-bottom:1px solid var(--rule)}
.dates div{display:flex;gap:7px}
.dates .k{font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.dates .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 12px}

/* pipeline (studio) */
.pipe{margin:0 0 26px}
.pipesteps{display:flex;gap:4px;flex-wrap:wrap}
.pipesteps button{flex:1;min-width:78px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--rule);
  padding:9px 4px;cursor:pointer;min-height:38px}
.pipesteps button.on{background:var(--sand-mid);color:var(--ink);border-color:var(--sand)}
.pipesteps button.at{background:var(--sand);color:var(--ink);border-color:var(--sand)}

/* reference shots */
.refs{margin:0 0 26px}
.refzone{position:relative;padding:4px;margin:-4px;transition:background .12s}
.refzone.dragover{background:var(--sand-wash);outline:2px dashed var(--sand);outline-offset:-2px}
.refzone.dragover::after{content:"Drop to add";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);font-size:11.5px;
  font-weight:600;letter-spacing:.04em;padding:8px 14px;pointer-events:none;z-index:2}
.refstrip{display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;
  scrollbar-width:none}
.refstrip::-webkit-scrollbar{display:none}
.ref{flex:none;width:108px;height:192px;background:var(--sand-wash);position:relative;
  display:flex;align-items:center;justify-content:center}
.ref img{width:108px;height:192px;object-fit:contain;display:block;background:var(--sand-wash)}
.ref .del{position:absolute;top:5px;right:5px;background:var(--paper);border:1px solid var(--rule-2);
  width:28px;height:28px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink-2);padding:0}
.ref.add{border:1px dashed var(--sand);cursor:pointer;flex-direction:column;gap:6px;font-size:11.5px;
  font-weight:600;color:var(--ink-2);text-align:center;padding:12px;background:var(--paper)}
.ref.add:hover{background:var(--sand-wash)}
.ref.add .plus{font-size:24px;color:var(--sand);line-height:1;font-weight:400}
.ref.add small{font-weight:500;color:var(--ink-3);font-size:10.5px;line-height:1.35}
.ref.add.wide{width:100%;min-width:210px;height:132px}
.ref.busy{font-size:11px;color:var(--ink-3);border:1px dashed var(--rule-2)}
.drophint{font-size:11.5px;color:var(--ink-3);margin:10px 0 0;max-width:58ch}
.drophint b{color:var(--ink-2);font-weight:600}
.drophint.warn{color:var(--ink);background:var(--sand-wash);border-left:3px solid var(--sand);
  padding:9px 12px}

/* shot list */
.film{margin:0 0 26px;padding:0;list-style:none;counter-reset:s}
.film li{counter-increment:s;position:relative;padding-left:30px;margin-bottom:12px;font-size:14.5px;
  color:var(--ink-2);max-width:58ch}
.film li::before{content:counter(s);position:absolute;left:0;top:1px;font-size:11px;font-weight:700;
  color:var(--ink);background:var(--sand-wash);width:20px;height:20px;line-height:20px;text-align:center;
  font-variant-numeric:tabular-nums}
.film li b{color:var(--ink);font-weight:600}
.saytxt{background:var(--sand-wash);padding:16px 18px;margin:0 0 26px;max-width:56ch}
.saytxt .label{margin-bottom:8px}
.saytxt p{margin:0;font-weight:500;font-size:14.5px;color:var(--ink)}
details.why{margin:0 0 24px}
details.why summary{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);cursor:pointer;list-style:none;padding:8px 0;min-height:38px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:" +";color:var(--sand)}
details.why[open] summary::after{content:" –"}
details.why p{font-size:13.5px;color:var(--ink-2);margin:6px 0 0;max-width:58ch}
details.why b{color:var(--ink);font-weight:600}
.pnote{border-top:1px solid var(--rule);padding-top:20px}
.pnote textarea{min-height:58px}
.pnote .from{font-size:11.5px;color:var(--ink-3);margin:0 0 9px}

/* inline text editing (studio) */
.edwrap{margin:0 0 24px}
.edtoggle{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  background:none;border:1px solid var(--rule-2);color:var(--ink-2);padding:8px 12px;cursor:pointer;
  min-height:36px}
.edtoggle:hover{background:var(--paper-2)}
.edfields{display:none;border-left:3px solid var(--sand);padding:4px 0 4px 16px;margin-top:14px}
.edwrap.open .edfields{display:block}
.edfields .edlabel{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 7px}
.edfields .edlabel:first-child{margin-top:0}
.edfields textarea{min-height:46px}

/* ══════════ month view ══════════ */
.mhead{padding:26px 0 0}
.mhead h2{font-size:26px;font-weight:700;margin:0;letter-spacing:-0.04em;line-height:1.12}
.mhead p{font-size:14.5px;color:var(--ink-2);margin:10px 0 0;max-width:58ch}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule-2);
  border-left:1px solid var(--rule);margin-top:24px}
.cal .dw{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule-2);
  font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 9px;background:var(--paper-2)}
.cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:112px;
  padding:8px 8px 10px;position:relative;min-width:0}
.cell.out{background:var(--paper-2)}
.cell.out .dnum{color:#CFCAC2}
.cell.today{box-shadow:inset 0 0 0 2px var(--sand)}
.dnum{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:4px}
.dnum em{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);background:var(--sand-mid);padding:2px 5px}
.chip{display:block;width:100%;text-align:left;margin-top:6px;border:0;border-left:2px solid var(--sand);
  background:var(--sand-wash);padding:6px 7px;cursor:pointer;min-width:0}
.chip:hover{background:var(--sand-mid)}
.chip .ct{display:block;font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:2px}
.chip .cn{display:block;font-size:11px;font-weight:600;color:var(--ink);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip.done{background:var(--sand)}
.chip.done .cn{text-decoration:line-through;color:var(--ink-2)}

.counts{display:flex;gap:38px;flex-wrap:wrap;border-top:2px solid var(--sand);margin-top:40px;padding-top:20px}
.count .n{font-size:28px;font-weight:700;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;
  display:block;line-height:1.1}
.count .l{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.block{margin-top:42px;border-top:1px solid var(--rule);padding-top:22px}
.block h3{font-size:12px;font-weight:700;margin:0 0 16px;letter-spacing:.12em;text-transform:uppercase}
.pil{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.pil:last-child{border-bottom:0}
.pil .c{flex:none;width:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.pil .nm{flex:none;width:158px;font-weight:600}
.pil .ds{color:var(--ink-2);flex:1;min-width:0}
.rhythm{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px}
.rhythm li{margin-bottom:9px}
.rhythm b{color:var(--ink);font-weight:600}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:0 14px 10px 0;border-bottom:2px solid var(--sand);white-space:nowrap}
td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
td.t{white-space:nowrap;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
td.n{color:var(--ink);min-width:190px}
td.n button{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--sand);text-underline-offset:3px}
td.dim{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-3)}
td.st{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap}
tr.is-done td.n{color:var(--ink-3)}
tr.is-done td.n button{text-decoration:line-through}
.wkrow td{padding-top:26px;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);border-bottom:1px solid var(--sand)}
.hint{font-size:13.5px;color:var(--ink-2);margin:22px 0 0;max-width:60ch}
details.how{margin:14px 0 0}
details.how summary{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);cursor:pointer;list-style:none;padding:9px 0;min-height:40px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:" +";color:var(--sand);font-weight:700}
details.how[open] summary::after{content:" –"}
details.how ol{margin:4px 0 0;padding-left:20px;color:var(--ink-2);font-size:14px}
details.how li{margin-bottom:8px}
details.how b{color:var(--ink);font-weight:600}
footer{border-top:1px solid var(--rule);margin-top:56px;padding-top:20px;font-size:12px;color:var(--ink-3)}

/* ══════════ role gating ══════════ */
.studio-only{display:none}
body[data-role="studio"] .studio-only{display:block}
body[data-role="studio"] .creator-only{display:none}
.pipesteps.studio-only{display:none}
body[data-role="studio"] .pipesteps.studio-only{display:flex}
body[data-role="studio"] .stagepill{display:block}
body[data-role="creator"] .stagepill{display:none}

/* ══════════ responsive ══════════ */
@media (max-width:1023px){
  :root{--pad:18px}
  .shell{display:block;padding-bottom:110px}
  .rail{position:static;padding-top:22px;max-width:520px}
  body[data-view="week"] .rail{display:none}
  .minical{display:none}
  .weeks{display:flex}
  .cell{min-height:64px;padding:5px 4px 6px}
  .cal .dw{padding:6px 5px;font-size:8.5px;letter-spacing:.06em}
  .dnum em{display:none}
  .chip{margin-top:4px;height:6px;padding:0;border-left:0;background:var(--sand-mid)}
  .chip .ct,.chip .cn{display:none}
  .chip.done{background:var(--ink)}
  .mhead h2,.wkhead h2{font-size:22px}
}
@media (max-width:600px){
  .brand{flex-direction:column;align-items:flex-start;gap:2px}
  .range{padding-left:0;border-left:0}
  .tabsrow{flex-direction:column;align-items:stretch;gap:0;margin-top:8px}
  .sync{text-align:left;padding:0 0 9px}
}
@media (max-width:767px){
  h1{font-size:15.5px}
  .range{font-size:11px}
  .body{padding-left:0}
  .head{grid-template-columns:44px 1fr auto;gap:13px}
  .daycol .dn{font-size:20px}
  .htext h4{font-size:15.5px}
  .hright{gap:10px}
  .stagepill{display:none!important}
  .pil{flex-wrap:wrap;gap:5px}
  .pil .nm{width:auto}
  .pil .ds{flex-basis:100%}
  .dates{gap:16px}
  .counts{gap:24px}
  .count .n{font-size:23px}
  .checkin-h{padding:16px 15px 0}
  .checkin-b{padding:12px 15px 16px}
  .tablewrap{overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--rule);padding:13px 0}
  td{border:0;padding:0;display:inline}
  td.n{display:block;font-weight:600;margin:3px 0}
  td.d,td.t{display:inline;margin-right:8px}
  td.dim::before{content:"· ";color:var(--sand)}
  td.dim{display:inline;margin-right:8px;font-size:11.5px}
  td.st{display:inline;margin-right:8px}
  .wkrow{border-bottom:1px solid var(--sand);padding:22px 0 6px}
  .wkrow td{display:block;padding:0;border:0}
  .pipesteps button{min-width:0;flex:1 1 30%}
}
@media (max-width:380px){
  :root{--pad:14px}
  .ref,.ref img{width:96px;height:170px}
  .tagline{gap:6px;font-size:9.5px}
}
</style>
</head>
<body data-role="creator" data-view="week">

<header>
  <div class="hd">
    <div class="hd-top">
      <div class="brand">
        <h1>Swatti &middot; Content Plan</h1>
        <span class="range" id="range">15 Sept &ndash; 14 Oct</span>
      </div>
      <div class="roleswitch" role="group" aria-label="Whose view">
        <button data-role="creator" aria-pressed="true">Swatti</button>
        <button data-role="studio" aria-pressed="false">Studio</button>
      </div>

      <div class="tabs" role="tablist">
        <button role="tab" id="v-week" aria-selected="true">This week</button>
        <button role="tab" id="v-month" aria-selected="false">Full month</button>
      </div>
      <div class="sync" id="sync"></div>
    </div>
  </div>
</header>

<div class="shell">

  <main>

      <div id="calwrap"></div>
      <div id="monthextra"></div>
    </div>

    <footer>Two shoot mornings a week. 15 reels, 5 carousels, plus whatever she films along the way.</footer>
  </main>
</div>

<input type="file" id="filepick" accept="image/*" multiple hidden>
